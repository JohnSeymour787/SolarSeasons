import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def apiKeyPropertiesFile = rootProject.file("apiKeys.properties")
def apiKeyProperties = new Properties()
apiKeyProperties.load(new FileInputStream(apiKeyPropertiesFile))
def kotlinVersion = rootProject.ext.kotlinVersion

android {
    defaultConfig {
        applicationId "com.johnseymour.solarseasons"
        minSdkVersion 29
        targetSdkVersion 37
        compileSdk 37
        versionCode 4
        versionName "4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "OPEN_UV_API_KEY", apiKeyProperties["OPENUV_API_KEY"]
        buildConfigField "String", "WEATHER_API_KEY", apiKeyProperties["WEATHER_API_KEY"]
        buildConfigField "boolean", "USE_GOOGLE_PLAY_LOCATION", 'false'
        buildConfigField "boolean", "ENABLE_MANUAL_LOCATION", 'false'
        buildConfigField "boolean", "ENABLE_API_KEY_ENTRY", 'false'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        luke {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "OPEN_UV_API_KEY", apiKeyProperties["OPENUV_API_KEY"]
            buildConfigField "boolean", "ENABLE_API_KEY_ENTRY", 'false'
        }

        nathan {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "OPEN_UV_API_KEY", '""'
            buildConfigField "boolean", "ENABLE_MANUAL_LOCATION", 'true'
            buildConfigField "boolean", "ENABLE_API_KEY_ENTRY", 'true'
        }

        steven {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "OPEN_UV_API_KEY", '""'
            buildConfigField "boolean", "ENABLE_API_KEY_ENTRY", 'true'
        }

        china {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "OPEN_UV_API_KEY", apiKeyProperties["OPENUV_API_KEY"]
            buildConfigField "boolean", "ENABLE_API_KEY_ENTRY", 'false'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace = 'com.johnseymour.solarseasons'

    buildFeatures {
        compose = true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.glance:glance-appwidget:1.2.0'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.3.0"

    implementation 'nl.komponents.kovenant:kovenant-android:3.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}